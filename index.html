<html lang="zh-TW">
<head>

    <style>
        :root {
            --bg: #f6efe3;
            --panel: rgba(255, 250, 242, 0.9);
            --panel-strong: #fffdf8;
            --line: rgba(122, 87, 38, 0.16);
            --ink: #2c2214;
            --muted: #746247;
            --brand: #8a5a2b;
            --brand-deep: #4c2f14;
            --accent: #d6a35f;
            --accent-soft: #f3e2c4;
            --ok: #3d7d5c;
            --shadow: 0 24px 54px rgba(77, 51, 20, 0.12);
            --shadow-soft: 0 8px 24px rgba(77, 51, 20, 0.08);
            --radius: 24px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at top left, rgba(214, 163, 95, 0.28), transparent 28%),
                radial-gradient(circle at top right, rgba(138, 90, 43, 0.16), transparent 24%),
                linear-gradient(180deg, #fdf9f2 0%, #f2e8da 100%);
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(143, 93, 44, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(143, 93, 44, 0.035) 1px, transparent 1px);
            background-size: 28px 28px;
            pointer-events: none;
            opacity: 0.55;
        }

        .shell {
            position: relative;
            width: min(1120px, calc(100% - 32px));
            margin: 0 auto;
            padding: 32px 0 48px;
        }

        .hero,
        .panel {
            background: var(--panel);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.65);
            box-shadow: var(--shadow);
            border-radius: var(--radius);
        }

        .hero {
            padding: 40px 38px 34px;
            overflow: hidden;
            position: relative;
            background:
                linear-gradient(140deg, rgba(255, 252, 246, 0.98) 0%, rgba(249, 239, 222, 0.9) 100%);
        }

        .hero::after {
            content: "";
            position: absolute;
            width: 340px;
            height: 340px;
            right: -120px;
            top: -120px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(214, 163, 95, 0.42), rgba(214, 163, 95, 0));
        }

        .hero::before {
            content: "";
            position: absolute;
            inset: auto auto 24px 24px;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(138, 90, 43, 0.12), rgba(138, 90, 43, 0));
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(138, 90, 43, 0.12), rgba(214, 163, 95, 0.18));
            color: var(--brand-deep);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.08em;
            box-shadow: var(--shadow-soft);
        }

        h1 {
            margin: 18px 0 10px;
            max-width: 920px;
            font-size: clamp(24px, 3.2vw, 38px);
            line-height: 1.2;
            letter-spacing: 0.02em;
            white-space: nowrap;
        }

        .hero-title {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 18px 0 10px;
        }

        .hero-title h1 {
            margin: 0;
        }

        .hero-logo {
            height: clamp(24px, 3.2vw, 38px);
            width: auto;
            flex: 0 0 auto;
            object-fit: contain;
        }

        .hero p {
            max-width: 800px;
            margin: 0 0 6px;
            color: var(--muted);
            font-size: 18px;
            line-height: 1.85;
        }

        .grid {
            display: grid;
            grid-template-columns: 1.4fr 1fr 1fr;
            gap: 18px;
            margin-top: 22px;
        }

        .panel {
            padding: 24px;
            margin-top: 18px;
            box-shadow: var(--shadow-soft);
        }

        .search-row {
            display: grid;
            grid-template-columns: minmax(0, 1.6fr) minmax(180px, 0.8fr) auto;
            gap: 14px;
            align-items: end;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--brand-deep);
            font-size: 14px;
            font-weight: 700;
        }

        input,
        select,
        button {
            font: inherit;
        }

        input,
        select {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.94);
            color: var(--ink);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: rgba(143, 93, 44, 0.6);
            box-shadow: 0 0 0 4px rgba(143, 93, 44, 0.12);
            transform: translateY(-1px);
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            border: 0;
            border-radius: 16px;
            padding: 14px 20px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        .primary {
            color: #fff;
            background: linear-gradient(135deg, var(--brand) 0%, var(--brand-deep) 100%);
            box-shadow: 0 14px 28px rgba(95, 59, 22, 0.24);
        }

        .ghost {
            color: var(--brand-deep);
            background: linear-gradient(135deg, rgba(138, 90, 43, 0.08), rgba(214, 163, 95, 0.16));
        }

        .stat {
            padding: 22px;
            border-radius: 22px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(255, 249, 239, 0.88));
            border: 1px solid rgba(143, 93, 44, 0.1);
        }

        .stat small {
            display: block;
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 10px;
        }

        .stat strong {
            display: block;
            font-size: clamp(24px, 3vw, 34px);
        }

        #dateRange {
            font-size: clamp(16px, 1.8vw, 24px);
            line-height: 1.35;
            white-space: nowrap;
        }

        .status {
            margin-top: 16px;
            color: var(--muted);
            font-size: 14px;
            min-height: 22px;
        }

        .status.is-hidden,
        .toolbar p.is-hidden {
            display: none;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .toolbar h2 {
            margin: 0;
            font-size: 24px;
        }

        .toolbar p {
            margin: 6px 0 0;
            color: var(--muted);
        }

        .count-badge {
            padding: 12px 16px;
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(138, 90, 43, 0.08), rgba(214, 163, 95, 0.18));
            color: var(--brand-deep);
            font-weight: 700;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
        }

        .results {
            display: grid;
            gap: 14px;
        }

        .result-card {
            padding: 20px;
            border: 1px solid rgba(143, 93, 44, 0.12);
            border-radius: 20px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(252, 247, 239, 0.92));
            box-shadow: var(--shadow-soft);
        }

        .result-head {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: start;
            flex-wrap: wrap;
        }

        .result-name {
            margin: 0;
            font-size: 22px;
        }

        .result-name mark,
        .table-name mark {
            background: rgba(216, 165, 90, 0.45);
            color: inherit;
            padding: 0 0.15em;
            border-radius: 0.2em;
        }

        .result-summary {
            margin-top: 10px;
            color: var(--muted);
        }

        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 14px;
        }

        .chip {
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(143, 93, 44, 0.08);
            color: var(--brand-deep);
            font-size: 13px;
            font-weight: 700;
        }

        .table-wrap {
            overflow: auto;
            border-radius: 20px;
            border: 1px solid rgba(143, 93, 44, 0.1);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.65);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 720px;
            background: rgba(255, 255, 255, 0.82);
        }

        th,
        td {
            text-align: left;
            padding: 15px 16px;
            border-bottom: 1px solid rgba(143, 93, 44, 0.1);
            vertical-align: top;
        }

        th {
            position: sticky;
            top: 0;
            background: linear-gradient(180deg, #fffdf9 0%, #f8efe1 100%);
            color: var(--brand-deep);
            font-size: 14px;
            z-index: 1;
        }

        tbody tr:hover {
            background: rgba(216, 165, 90, 0.1);
        }

        .table-name {
            font-weight: 700;
        }

        .amount {
            font-variant-numeric: tabular-nums;
            color: var(--brand-deep);
            font-weight: 700;
        }

        .empty {
            padding: 32px 18px;
            text-align: center;
            color: var(--muted);
            line-height: 1.8;
        }

        .loader {
            display: inline-flex;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(143, 93, 44, 0.18);
            border-top-color: var(--brand);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        .file-input {
            margin-top: 14px;
            display: none;
        }

        .file-input.is-visible {
            display: block;
        }

        .footnote {
            margin-top: 18px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.7;
            padding-top: 12px;
            border-top: 1px solid rgba(138, 90, 43, 0.08);
        }

        .pager {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        .pager-info {
            color: var(--muted);
            font-size: 14px;
        }

        .pager-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .pager-buttons button {
            padding: 10px 14px;
            border-radius: 12px;
            background: rgba(143, 93, 44, 0.1);
            color: var(--brand-deep);
        }

        .pager-buttons button[disabled] {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        .pager-buttons button.active {
            background: linear-gradient(135deg, var(--brand) 0%, var(--brand-deep) 100%);
            color: #fff;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 900px) {
            .grid,
            .search-row {
                grid-template-columns: 1fr;
            }

            .hero,
            .panel {
                padding: 22px;
            }
        }

        @media (max-width: 640px) {
            .shell {
                width: min(100% - 20px, 1120px);
                padding-top: 20px;
            }

            h1 {
                font-size: 30px;
            }

            .result-name {
                font-size: 19px;
            }
        }
    </style>

        function updateDatasetSummary() {
            if (!state.rows.length) {
                refs.dateRange.textContent = "-";
                return;
            }

            const sortedDates = [...state.rows]
                .map((row) => row["日期"])
                .filter(Boolean)
                .sort((a, b) => rocDateToNumber(a) - rocDateToNumber(b));

            refs.dateRange.textContent = `${sortedDates[0]} - ${sortedDates[sortedDates.length - 1]}`;
        }

        function updateUnitOptions() {
            const units = [...new Set(state.rows.map((row) => row["受贈單位"]).filter(Boolean))].sort((a, b) => a.localeCompare(b, "zh-Hant"));
            refs.unitFilter.innerHTML = '<option value="">全部單位</option>' +
                units.map((unit) => `<option value="${escapeHtml(unit)}">${escapeHtml(unit)}</option>`).join("");
        }

        function renderTopMatches(keyword) {
            if (!state.filtered.length || !keyword) {
                refs.topMatches.innerHTML = "";
                return;
            }

            const grouped = new Map();

            for (const row of state.filtered) {
                const key = row["大德姓名"];
                if (!grouped.has(key)) {
                    grouped.set(key, {
                        name: key,
                        count: 0,
                        total: 0,
                        latestDate: row["日期"] || "",
                    });
                }

                const item = grouped.get(key);
                item.count += 1;
                item.total += Number(row["金額"] || 0);
                if (rocDateToNumber(row["日期"]) > rocDateToNumber(item.latestDate)) {
                    item.latestDate = row["日期"];
                }
            }

            const top = [...grouped.values()]
                .sort((a, b) => {
                    if (b.count !== a.count) return b.count - a.count;
                    if (b.total !== a.total) return b.total - a.total;
                    return rocDateToNumber(b.latestDate) - rocDateToNumber(a.latestDate);
                })
                .slice(0, 6);

            refs.topMatches.innerHTML = top.map((item) => `
                <article class="result-card">
                    <div class="result-head">
                        <h3 class="result-name">${highlightText(item.name, keyword)}</h3>
                        <span class="chip">共 ${item.count.toLocaleString("zh-TW")} 筆</span>
                    </div>
                    <div class="result-summary">累計金額 ${formatAmount(item.total)}</div>
                    <div class="meta">
                        <span class="chip">最近日期 ${escapeHtml(item.latestDate || "-")}</span>
                    </div>
                </article>
            `).join("");
        }

        function renderTable(keyword) {

            const totalPages = Math.max(1, Math.ceil(state.filtered.length / state.pageSize));
            if (state.currentPage > totalPages) {

            const startIndex = (state.currentPage - 1) * state.pageSize;

            refs.resultTable.innerHTML = pageRows.map((row) => `

            const from = startIndex + 1;

            renderPagination(totalPages);

        function renderPagination(totalPages) {
            if (totalPages <= 1) {
                refs.pagination.innerHTML = "";

            const pages = [];

            for (let i = start; i <= end; i += 1) {

                `);
            }

            pages.push(`
                <button type="button" ${state.currentPage === totalPages ? "disabled" : ""} data-page="${state.currentPage + 1}">
                    下一頁
                </button>
            `);

            refs.pagination.innerHTML = pages.join("");
        }

        function runSearch() {
            const keyword = refs.searchInput.value.trim();
            const keywordLower = keyword.toLowerCase();
            const unit = refs.unitFilter.value;

            state.filtered = state.rows
                .filter((row) => !keywordLower || row["大德姓名"].toLowerCase().includes(keywordLower))
                .filter((row) => !unit || row["受贈單位"] === unit)
                .sort((a, b) => rocDateToNumber(b["日期"]) - rocDateToNumber(a["日期"]));
            state.currentPage = 1;

            refs.matchCount.textContent = `${state.filtered.length.toLocaleString("zh-TW")} 筆`;

            if (!keyword && !unit) {
                refs.summaryText.textContent = `目前顯示全部資料，共 ${state.filtered.length.toLocaleString("zh-TW")} 筆。`;
            } else if (keyword && unit) {
                refs.summaryText.textContent = `姓名包含「${keyword}」且受贈單位為「${unit}」的結果如下。`;
            } else if (keyword) {
                refs.summaryText.textContent = `姓名包含「${keyword}」的結果如下。`;
            } else {
                refs.summaryText.textContent = `目前只顯示受贈單位為「${unit}」的資料。`;
            }

            renderTopMatches(keyword);
            renderTable(keyword);
        }

        refs.pagination.addEventListener("click", (event) => {
            const button = event.target.closest("button[data-page]");
            if (!button || button.disabled) return;

            const nextPage = Number(button.dataset.page);
            if (!Number.isFinite(nextPage) || nextPage < 1) return;

            state.currentPage = nextPage;
            renderTable(refs.searchInput.value.trim());
        });

        function applyDataset(rows, sourceLabel) {
            state.rows = normalizeRows(rows);
            updateDatasetSummary();
            updateUnitOptions();
            runSearch();
            setStatus(`資料已載入，共 ${state.rows.length.toLocaleString("zh-TW")} 筆，來源：${escapeHtml(sourceLabel)}。`);
        }

        async function loadDefaultData() {
            if (Array.isArray(window.__DONATIONS_DATA__) && window.__DONATIONS_DATA__.length) {
                applyDataset(window.__DONATIONS_DATA__, "donations-data.js");
                return;
            }

            try {
                const response = await fetch("./donations.json");
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const rows = await response.json();
                applyDataset(rows, "donations.json");
            } catch (error) {
                refs.filePanel.classList.add("is-visible");
                setStatus("自動載入 donations.json 失敗，請在下方選取同資料夾內的 donations.json。", true);
                refs.resultTable.innerHTML = `
                    <tr>
                        <td colspan="5" class="empty">這通常是瀏覽器直接用檔案方式開啟頁面造成的限制。選取 JSON 後就可以正常搜尋。</td>
                    </tr>
                `;
            }
        }

        refs.searchInput.addEventListener("input", runSearch);
        refs.unitFilter.addEventListener("change", runSearch);
        refs.searchButton.addEventListener("click", runSearch);
        refs.resetButton.addEventListener("click", () => {
            refs.searchInput.value = "";
            refs.unitFilter.value = "";
            runSearch();
        });

        refs.jsonFile.addEventListener("change", async (event) => {
            const file = event.target.files?.[0];
            if (!file) return;

            try {
                const text = await file.text();
                const rows = JSON.parse(text);
                applyDataset(rows, file.name);
            } catch (error) {
                setStatus("讀取 JSON 失敗，請確認檔案內容是正確的 UTF-8 JSON。", true);
            }
        });

        loadDefaultData();
    </script>
</body>
</html>
